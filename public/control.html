<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>catalyst — overlay control</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("/fonts/Archivo-var.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  :root {
    --navy: #003087;
    --silver: #a5a8bc;
    --green: #25b001;
    --amber: #d9a400;
    --bg: #0c0e14;
    --card: #161a24;
    --line: #262c3a;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: #e8eaf0;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--silver);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .row + .row {
    margin-top: 10px;
  }
  input,
  select,
  button {
    font: inherit;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0f131c;
    color: inherit;
    padding: 9px 11px;
  }
  input:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }
  input.bad {
    border-color: #a33;
    color: #ff8f88;
  }
  input[type="text"].dur {
    width: 88px;
  }
  input[type="datetime-local"] {
    width: 200px;
  }
  .grow {
    flex: 1;
    min-width: 120px;
  }
  button {
    background: #1e2432;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background: #2a3244;
  }
  button.go {
    background: var(--navy);
    border-color: #0a49c4;
  }
  button.go:hover {
    background: #0a49c4;
  }
  button.on {
    background: #12351c;
    border-color: #2f7a2a;
    color: #7fe36b;
  }
  button.on.live {
    background: var(--green);
    border-color: var(--green);
    color: #06210b;
  }
  button.danger:hover {
    background: #5a1d1d;
  }
  #clock {
    font-size: 46px;
    font-weight: 800;
    font-stretch: 85%;
    line-height: 1;
    margin: 2px 0 12px;
  }
  #clock.paused {
    color: var(--silver);
  }

  /* ---------- cues ---------- */
  /* off / auto / on, one segmented control. "auto" is the whole point: the cue
     puts itself on screen when its moment comes near. */
  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    border-radius: 0;
    padding: 9px 10px;
    background: #0f131c;
    font-size: 13px;
    color: #79809a;
  }
  .seg button + button {
    border-left: 1px solid var(--line);
  }
  .seg button[aria-pressed="true"] {
    background: #1e2432;
    color: #e8eaf0;
  }
  .seg button[data-show="auto"][aria-pressed="true"] {
    background: #12351c;
    color: #7fe36b;
  }
  .seg button[data-show="on"][aria-pressed="true"] {
    background: var(--green);
    color: #06210b;
  }
  .cue {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    background: #10141d;
  }
  .cue .when {
    width: 194px;
  }
  .cue .quick {
    width: 112px;
  }
  .cue select {
    padding: 8px 9px;
  }
  .cue .eta {
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .eta[data-status="live"],
  .eta[data-status="pinned"] {
    color: var(--green);
  }
  .eta[data-status="queued"] {
    color: var(--amber);
  }
  .eta[data-status="off"],
  .eta[data-status="lapsed"] {
    color: #79809a;
  }
  .muted {
    color: #79809a;
  }
  #air {
    border-left: 3px solid var(--green);
    padding-left: 10px;
    margin-bottom: 12px;
    line-height: 1.5;
    min-height: 21px;
  }
  #air.empty {
    border-color: var(--line);
    color: #79809a;
  }
  #conn {
    float: right;
    font-size: 12px;
    color: var(--green);
  }
  #conn.down {
    color: #ff5f56;
  }
</style>

<section>
  <h2>build clock <span id="conn">live</span></h2>
  <div id="clock">--:--:--</div>
  <div class="row">
    <button class="go" id="startPause">start</button>
    <input id="dur" class="dur" type="text" value="48:00:00" title="hh:mm:ss" />
    <button id="reset">load</button>
    <span class="muted" id="endsAt"></span>
  </div>
  <div class="row">
    <input id="endInput" type="datetime-local" />
    <button id="setEnd">end at</button>
    <span class="muted">run until a wall clock moment</span>
  </div>
  <div class="row">
    <button data-adj="-900">−15m</button>
    <button data-adj="-300">−5m</button>
    <button data-adj="-60">−1m</button>
    <button data-adj="60">+1m</button>
    <button data-adj="300">+5m</button>
    <button data-adj="900">+15m</button>
  </div>
  <div class="row">
    <input id="label" class="grow" placeholder="clock label" />
    <button id="tgTimer">timer</button>
  </div>
</section>

<section>
  <h2>cues</h2>
  <div id="air" class="empty">nothing on screen</div>
  <div id="cues"></div>
  <div class="row">
    <button id="addCallout">+ callout</button>
    <button id="addBanner">+ banner</button>
    <button id="sort">sort by time</button>
    <span class="muted"
      >pick a date for anything days out; the second box is the shortcut — <b>20</b> in 20 min ·
      <b>1h30</b> · <b>2:15am</b> tonight</span
    >
  </div>
</section>

<section>
  <h2>branding</h2>
  <div class="row">
    <input id="sponsorCaption" class="grow" placeholder="sponsor caption" />
    <button id="tgSponsor">sponsor</button>
    <button id="tgLogo">logo</button>
  </div>
</section>

<script type="module">
  import { target, status, onAir, until } from "/cue.js";

  const $ = (s) => document.querySelector(s);
  let state = null,
    ws = null,
    ids = "",
    skew = 0; // server epoch − local epoch
  const now = () => Date.now() + skew;

  // ?key=... once, then it sticks for the bookmarked obs dock
  const qKey = new URLSearchParams(location.search).get("key");
  if (qKey !== null) localStorage.setItem("catalystKey", qKey);
  const KEY = localStorage.getItem("catalystKey") ?? "";

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws?key=${encodeURIComponent(KEY)}`);
    ws.onopen = () => {
      $("#conn").textContent = "live";
      $("#conn").classList.remove("down");
    };
    ws.onmessage = (e) => {
      state = JSON.parse(e.data);
      if (state.t) skew = state.t - Date.now();
      render();
    };
    ws.onclose = () => {
      $("#conn").textContent = "reconnecting";
      $("#conn").classList.add("down");
      setTimeout(connect, 1000);
    };
    ws.onerror = () => ws.close();
  }
  connect();

  function push(patch) {
    Object.assign(state, deep(state, patch));
    if (ws?.readyState === 1) ws.send(JSON.stringify(patch));
    render();
  }
  function deep(base, patch) {
    if (Array.isArray(patch) || patch === null || typeof patch !== "object") return patch;
    const out = { ...base };
    for (const k in patch) out[k] = deep(base?.[k], patch[k]);
    return out;
  }

  const pad = (n) => String(n).padStart(2, "0");
  const hms = (ms) => {
    const t = Math.max(0, Math.round(ms / 1000));
    return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`;
  };
  const parseDur = (s) => {
    const p = s.split(":").map(Number).reverse();
    return ((p[0] || 0) + (p[1] || 0) * 60 + (p[2] || 0) * 3600) * 1000;
  };
  const left = () =>
    state.build.paused ? state.build.remainingMs : (state.build.endsAt ?? now()) - now();
  // yyyy-mm-ddThh:mm in the operator's local time, what datetime-local wants
  const localStamp = (ts) => {
    const d = new Date(ts - skew);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const clockAt = (ts) =>
    new Date(ts - skew).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  // ---- build clock ----
  $("#startPause").onclick = () => {
    const b = state.build;
    push(
      b.paused
        ? { build: { paused: false, endsAt: now() + b.remainingMs } }
        : { build: { paused: true, remainingMs: Math.max(0, b.endsAt - now()) } },
    );
  };
  $("#reset").onclick = () =>
    push({ build: { paused: true, remainingMs: parseDur($("#dur").value), endsAt: null } });
  // an absolute end time is the same thing as a running clock, so it starts one
  $("#setEnd").onclick = () => {
    const v = $("#endInput").value;
    if (!v) return;
    const ts = new Date(v).getTime() + skew; // typed in local time, stored on the server's clock
    push({ build: { paused: false, endsAt: ts, remainingMs: Math.max(0, ts - now()) } });
  };
  document.querySelectorAll("[data-adj]").forEach((b) => {
    b.onclick = () => {
      const ms = Number(b.dataset.adj) * 1000;
      push(
        state.build.paused
          ? { build: { remainingMs: Math.max(0, state.build.remainingMs + ms) } }
          : { build: { endsAt: state.build.endsAt + ms } },
      );
    };
  });
  $("#label").oninput = (e) => push({ build: { label: e.target.value } });
  $("#tgTimer").onclick = () => push({ show: { timer: !state.show.timer } });

  // ---- the shortcut box: every way an operator says a time in a hurry ----
  // "20" / "+20" / "90m" → minutes out. "1h30" → hours and minutes out.
  // "2:15am" / "14:30" → that wall clock, rolling to tomorrow if it's past.
  // anything further out is the date picker's job. undefined back means it didn't parse.
  function parseWhen(raw, t) {
    const s = raw.trim().toLowerCase();
    if (!s || s === "-" || s === "—") return null;
    if (s === "now") return t;

    const abs = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
    if (abs && (abs[2] !== undefined || abs[3])) {
      let h = Number(abs[1]);
      if (abs[3]) h = (h % 12) + (abs[3] === "pm" ? 12 : 0);
      const d = new Date(t - skew);
      d.setHours(h, Number(abs[2] ?? 0), 0, 0);
      if (d.getTime() < t - skew) d.setDate(d.getDate() + 1); // overnight build, roll forward
      return d.getTime() + skew;
    }

    const rel = s.replace(/^\+/, "").match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*(?:m|min)?)?$/);
    if (rel && (rel[1] || rel[2]))
      return t + ((Number(rel[1] ?? 0) * 60 + Number(rel[2] ?? 0)) * 60000);
    return undefined;
  }
  // the picker doubles as the readout, so it always shows where the cue actually
  // landed — for a repeat, that's the next roll rather than the original anchor
  const showWhen = (c) => (c.at === null ? "" : localStamp(target(c, now())));

  const WORDS = {
    live: "on screen",
    pinned: "pinned on screen",
    queued: "queued",
    lapsed: "done",
    off: "off",
  };

  // ---- cues ----
  const EVERY = [0, 5, 10, 15, 20, 30, 45, 60, 90, 120];
  const LEAD = [null, 5, 10, 15, 30, 60, 120];
  const opt = (v, t, sel) => `<option value="${v}"${v === sel ? " selected" : ""}>${t}</option>`;
  // a value POSTed to /state that isn't on the menu still has to be selectable,
  // or the panel would silently misreport what the overlay is doing
  const withCur = (list, v) => (list.includes(v) ? list : [...list, v].sort((a, b) => a - b));

  const add = (kind) =>
    push({
      cues: [
        ...state.cues,
        {
          id: "c" + Date.now().toString(36),
          kind,
          label: kind === "banner" ? "" : "new callout",
          tone: "info",
          at: null,
          every: 0,
          lead: null,
          hold: 2,
          show: "off",
        },
      ],
    });
  $("#addCallout").onclick = () => add("callout");
  $("#addBanner").onclick = () => add("banner");
  // explicit, so cards never reshuffle under a cursor mid-edit
  $("#sort").onclick = () =>
    push({
      cues: [...state.cues].sort(
        (a, b) => (target(a, now()) ?? Infinity) - (target(b, now()) ?? Infinity),
      ),
    });

  const cur = (id) => state.cues.find((c) => c.id === id);
  function setCue(id, patch) {
    push({ cues: state.cues.map((c) => (c.id === id ? { ...c, ...patch } : c)) });
  }

  function buildCues() {
    const box = $("#cues");
    box.innerHTML = "";
    for (const c of state.cues) {
      const el = document.createElement("div");
      el.className = "cue";
      el.dataset.id = c.id;
      el.innerHTML = `
        <div class="row">
          <div class="seg">
            <button data-show="off">off</button>
            <button data-show="auto" title="on screen when its moment comes near">auto</button>
            <button data-show="on" title="on screen until you say otherwise">on</button>
          </div>
          <input class="grow lbl" placeholder="message">
          <button class="danger del" title="delete">×</button>
        </div>
        <div class="row">
          <input class="when" type="datetime-local" title="the moment this cue is for">
          <input class="quick" placeholder="20 · 2:15am" title="type a time and hit enter">
          <select class="every">${withCur(EVERY, c.every).map((v) => opt(v, v ? `every ${v}m` : "once", c.every)).join("")}</select>
          <select class="lead">${withCur(LEAD, c.lead).map((v) => opt(v, v === null ? "show always" : `show ${v}m ahead`, c.lead)).join("")}</select>
          <select class="kind">${opt("callout", "callout", c.kind)}${opt("banner", "banner", c.kind)}</select>
          <select class="tone">${["break", "recap", "info"].map((v) => opt(v, v, c.tone)).join("")}</select>
          <button class="bump" title="push back 5 minutes">+5m</button>
          <span class="eta"></span>
        </div>`;
      const q = (s) => el.querySelector(s);

      q(".lbl").oninput = (e) => setCue(c.id, { label: e.target.value });
      q(".del").onclick = () => push({ cues: state.cues.filter((x) => x.id !== c.id) });
      el.querySelectorAll(".seg button").forEach((b) => {
        b.onclick = () => setCue(c.id, { show: b.dataset.show });
      });

      // giving a cue a time is how you arm it; nobody sets a time meaning "stay off".
      // clearing it back to null leaves the cue alone as a plain message.
      const setAt = (at) =>
        setCue(c.id, { at, show: at !== null && cur(c.id).show === "off" ? "auto" : cur(c.id).show });

      const when = q(".when");
      when.onchange = () =>
        setAt(when.value ? new Date(when.value).getTime() + skew : null); // typed local, stored on the server's clock

      // the shortcut box is a command, not a field: it commits and empties itself,
      // so the picker beside it is the only thing that ever reads as the cue's time
      const quick = q(".quick");
      quick.oninput = () => quick.classList.remove("bad");
      quick.onkeydown = (e) => {
        if (e.key !== "Enter") return;
        const at = parseWhen(quick.value, now());
        quick.classList.toggle("bad", at === undefined);
        if (at === undefined) return;
        quick.value = "";
        setAt(at);
      };

      q(".every").onchange = (e) => setCue(c.id, { every: Number(e.target.value) });
      q(".lead").onchange = (e) =>
        setCue(c.id, { lead: e.target.value === "null" ? null : Number(e.target.value) });
      q(".kind").onchange = (e) => setCue(c.id, { kind: e.target.value });
      q(".tone").onchange = (e) => setCue(c.id, { tone: e.target.value });
      q(".bump").onclick = () => {
        const c2 = cur(c.id);
        setCue(c.id, { at: (target(c2, now()) ?? now()) + 300000 });
      };
      box.append(el);
    }
  }

  // ---- misc ----
  $("#sponsorCaption").oninput = (e) => push({ sponsor: { caption: e.target.value } });
  $("#tgSponsor").onclick = () => push({ sponsor: { visible: !state.sponsor.visible } });
  $("#tgLogo").onclick = () => push({ show: { logo: !state.show.logo } });

  function setVal(el, v) {
    if (document.activeElement !== el && el.value !== v) el.value = v;
  }

  function render() {
    if (!state) return;
    const t = now();
    const l = left();
    $("#clock").textContent = hms(l);
    $("#clock").classList.toggle("paused", state.build.paused);
    $("#startPause").textContent = state.build.paused ? "start" : "pause";
    $("#startPause").classList.toggle("on", !state.build.paused);
    $("#startPause").classList.toggle("live", !state.build.paused);
    $("#endsAt").textContent =
      !state.build.paused && state.build.endsAt ? "ends " + clockAt(state.build.endsAt) : "";
    setVal($("#endInput"), localStamp(state.build.paused ? t + l : (state.build.endsAt ?? t)));
    setVal($("#label"), state.build.label);
    setVal($("#sponsorCaption"), state.sponsor.caption);
    $("#tgTimer").classList.toggle("on", state.show.timer);
    $("#tgLogo").classList.toggle("on", state.show.logo);
    $("#tgSponsor").classList.toggle("on", state.sponsor.visible);

    const sig = state.cues.map((c) => c.id).join(",");
    if (sig !== ids) {
      ids = sig;
      buildCues();
    }

    // what the overlay is actually showing, so the panel is trustworthy without alt-tabbing
    const air = state.cues.filter((c) => onAir(c, t) && (c.kind === "callout" || c.label));
    $("#air").classList.toggle("empty", !air.length);
    $("#air").textContent = air.length
      ? air
          .map((c) => {
            const tgt = target(c, t);
            return c.label + (tgt === null ? "" : ` — ${until(tgt - t)}`);
          })
          .join(" · ")
      : "nothing on screen";

    for (const c of state.cues) {
      const el = $(`.cue[data-id="${c.id}"]`);
      if (!el) continue;
      setVal(el.querySelector(".lbl"), c.label);
      setVal(el.querySelector(".when"), showWhen(c));
      el.querySelector(".every").value = String(c.every);
      el.querySelector(".lead").value = String(c.lead);
      el.querySelector(".kind").value = c.kind;
      el.querySelector(".tone").value = c.tone;
      el.querySelector(".tone").style.display = c.kind === "callout" ? "" : "none";
      el.querySelectorAll(".seg button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.show === c.show)),
      );

      const st = status(c, t);
      const tgt = target(c, t);
      el.querySelector(".eta").dataset.status = st;
      el.querySelector(".eta").textContent =
        tgt === null ? WORDS[st] : `${WORDS[st]} · ${until(tgt - t)}`;
    }
  }
  setInterval(render, 500);
</script>
